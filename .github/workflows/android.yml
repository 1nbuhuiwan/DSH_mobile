name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: 构建 Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # compileSdk 36 / AGP 8.9+ 需要 JDK 17
      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 授予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
